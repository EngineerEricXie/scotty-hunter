name: Verify UI before publication
on:
  push:
    branches: ["design/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build:pages
      - name: Use installed Chrome for public-site verification
        run: |
          chrome=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$chrome" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node scripts/ui-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scotty-ui-review
          path: qa
          retention-days: 7
