name: Verify UI before publication
on:
  push:
    branches: ["design/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ui-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scotty-ui-review
          path: qa
          retention-days: 7
