name: Verify UI before publication
on:
  push:
    branches: ["design/**"]
  workflow_dispatch:
    inputs:
      qa_url:
        description: "Optional published app URL; blank tests the local build"
        required: false
        type: string
      expected_source:
        description: "Expected deployment.json source_commit for public verification"
        required: false
        type: string
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build:pages
      - name: Select Chromium for browser checks
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$CHROME" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node scripts/ui-qa.mjs
        env:
          SCOTTY_QA_URL: ${{ inputs.qa_url }}
          SCOTTY_EXPECTED_SOURCE: ${{ inputs.expected_source }}
          SCOTTY_REQUIRE_LIVE_TILES: "1"
          SCOTTY_QA_ONLY_ROUTE: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scotty-ui-review
          path: qa
          retention-days: 7
